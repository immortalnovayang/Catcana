<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1430" />
    <title>貓咪占卜師</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>貓咪占卜師</h1>
        <p class="sub">原型 · 單關測試</p>
      </header>

      <section class="hud" aria-label="狀態">
        <div id="score-card" class="stat score">
          <span class="label">分數 / 目標</span>
          <span class="value"><span id="stat-score">0</span><span class="of"> / <span id="stat-target">0</span></span></span>
          <div class="bar"><div id="score-bar" class="bar-fill"></div></div>
        </div>
        <div class="stat"><span class="label">剩餘步數</span><span id="stat-steps" class="value">0</span></div>
      </section>
      <p id="step-info" class="step-info"></p>

      <div class="board-wrap">
        <div id="board" class="board" role="application" aria-label="三消盤面"></div>
        <div id="result" class="result" hidden>
          <div class="result-card">
            <h2 id="result-title"></h2>
            <dl>
              <div><dt>得分</dt><dd id="result-score"></dd></div>
              <div><dt>目標</dt><dd id="result-target"></dd></div>
              <div><dt>剩餘步數</dt><dd id="result-steps"></dd></div>
              <div><dt>最高連鎖</dt><dd id="result-chain"></dd></div>
            </dl>
            <p id="result-note" class="result-note"></p>
            <div class="result-actions">
              <button id="btn-next" type="button">新的一盤</button>
              <button id="btn-retry" type="button" class="ghost">重玩這盤</button>
            </div>
          </div>
        </div>
      </div>

      <section class="actions">
        <button id="btn-shuffle" type="button">洗牌（2）</button>
        <button id="btn-new" type="button" class="ghost">新盤面</button>
      </section>

      <footer class="foot">
        <p>滑動水晶，或先點一顆再點旁邊那顆來交換。三顆同色連線就會消除。</p>
        <p>得分 =（水晶分數 + 形狀加值）× 連鎖倍率。4 連、5 連、L / T 形有加值，連鎖越多層倍率越高。</p>
        <p class="meta"><span id="version"></span> · 種子 <span id="seed"></span></p>
      </footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
