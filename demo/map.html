<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0820" />
    <title>星盤試作 · 貓咪占卜師</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" />
    <style>
      :root {
        --gold: #ffd36e;
        --gold-mid: #d9a441;
        --gold-dark: #8a5a12;
        --gold-deep: #3a2206;
        --rose: #ff6e8c;
        --text: #f4ecff;
        --muted: #b5a6d6;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0820;
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .app {
        position: relative;
        height: 100dvh;
        max-width: 520px;
        margin: 0 auto;
        padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ic {
        width: 1.4em;
        height: 1.4em;
        display: block;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .title {
        flex: 1;
        text-align: center;
      }
      .title h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        background: linear-gradient(180deg, #fff6d8, var(--gold) 55%, #e09a2a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .title p {
        margin: 2px 0 0;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        flex: none;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1.5px solid rgba(255, 211, 110, 0.5);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #4a3290, #1d1240);
        color: var(--gold);
        cursor: pointer;
        box-shadow: 0 3px 0 #120a2a;
      }
      .icon-btn .ic {
        width: 20px;
        height: 20px;
      }
      .icon-btn.on {
        background: radial-gradient(circle at 35% 30%, #fff1bf, var(--gold) 60%, #e8a93a);
        color: var(--gold-deep);
      }
      .map-area {
        flex: 1;
        min-height: 0;
        padding: 30px 0 6px; /* Boss 星比較大，上方留空間給它的光暈與徽章 */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .map {
        position: relative;
      }
      /* 星星節點 */
      .node {
        position: absolute;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 2px solid rgba(255, 211, 110, 0.55);
        background: radial-gradient(circle at 40% 35%, #4a3290, #1b1040 75%);
        color: var(--gold);
        cursor: pointer;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.35), 0 4px 10px rgba(0, 0, 0, 0.45);
        transition: transform 160ms ease, opacity 200ms ease, filter 200ms ease;
      }
      .node .ic {
        width: 24px;
        height: 24px;
      }
      .node.elite {
        border-color: var(--rose);
        color: #ffb3c2;
        background: radial-gradient(circle at 40% 35%, #6a2350, #1d0f30 75%);
      }
      .node.shop {
        color: #8ff0d8;
        border-color: #4fd1b5;
      }
      .node.fountain {
        color: #9fd0ff;
        border-color: #6fb6ff;
      }
      .node.rest {
        color: #e2c6ff;
        border-color: #b48cff;
      }
      .node.meteor {
        color: #fff2a8;
        border-color: #ffe28a;
      }
      .node.boss {
        width: 68px;
        height: 68px;
        margin: -34px 0 0 -34px;
        border: 3px solid var(--rose);
        color: #fff;
        background: radial-gradient(circle at 40% 35%, #8a2a5a, #2a0f30 75%);
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.35), 0 0 26px rgba(255, 110, 140, 0.6);
      }
      .node.boss .ic {
        width: 36px;
        height: 36px;
      }
      .node.start {
        width: 54px;
        height: 54px;
        margin: -27px 0 0 -27px;
        border-color: var(--gold);
        background: radial-gradient(circle at 40% 35%, #7a2a3a, #2a1020 75%);
      }
      .node.start .ic {
        width: 28px;
        height: 28px;
      }
      .node.hidden {
        color: var(--muted);
        border: 2px dashed rgba(255, 255, 255, 0.35);
        background: rgba(20, 12, 45, 0.85);
      }
      .node.far {
        opacity: 0.38;
        filter: grayscale(0.6);
      }
      .node.visited {
        border-color: var(--gold);
        background: radial-gradient(circle at 40% 35%, #fff1bf, var(--gold) 55%, #c9871f);
        color: var(--gold-deep);
      }
      .node.choice {
        animation: pulse 1.1s ease-in-out infinite;
      }
      .node.selected {
        transform: scale(1.18);
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.35), 0 0 0 8px rgba(255, 211, 110, 0.35), 0 0 22px rgba(255, 211, 110, 0.75);
        }
      }
      /* 月相小徽章 */
      .moon {
        position: absolute;
        right: -7px;
        top: -7px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #120a2a;
        border: 1.5px solid rgba(255, 211, 110, 0.6);
        display: grid;
        place-items: center;
      }
      .moon svg {
        width: 14px;
        height: 14px;
        display: block;
      }
      .here {
        position: absolute;
        left: 50%;
        top: -26px;
        transform: translateX(-50%);
        padding: 1px 7px;
        border-radius: 7px;
        font-size: 0.65rem;
        font-weight: 800;
        white-space: nowrap;
        color: var(--gold-deep);
        background: var(--gold);
        box-shadow: 0 2px 0 var(--gold-dark);
      }
      /* 下方資訊面板 */
      .panel {
        flex: none;
        min-height: 128px;
        padding: 12px 14px;
        border-radius: 18px;
        border: 2px solid var(--gold-mid);
        background: linear-gradient(180deg, rgba(79, 31, 98, 0.95), rgba(42, 15, 60, 0.96));
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.4), inset 0 0 0 3px rgba(255, 211, 110, 0.25), 0 -6px 20px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .panel-ic {
        width: 40px;
        height: 40px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        color: var(--gold);
      }
      .panel-ic .ic {
        width: 24px;
        height: 24px;
      }
      .panel h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 900;
      }
      .panel .kind {
        font-size: 0.72rem;
        color: var(--muted);
      }
      .panel p {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.5;
      }
      .panel .moon-line {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.3);
        font-size: 0.8rem;
        color: #e6dcff;
      }
      .panel .moon-line svg {
        width: 18px;
        height: 18px;
        flex: none;
        margin-top: 1px;
      }
      .go {
        align-self: flex-end;
        font: inherit;
        font-weight: 800;
        font-size: 0.95rem;
        padding: 9px 18px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        color: var(--gold-deep);
        background: linear-gradient(180deg, #fff1bf, var(--gold) 50%, #e8a93a);
        box-shadow: 0 4px 0 var(--gold-dark);
      }
      .go:disabled {
        filter: grayscale(0.8) brightness(0.65);
      }
      .go:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--gold-dark);
      }
      .progress {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin-top: 4px;
      }
      .progress span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
      }
      .progress span.done {
        background: var(--gold);
        box-shadow: 0 0 6px var(--gold);
      }
      .finish {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        padding: 16px;
        background: rgba(5, 3, 15, 0.55);
      }
      .finish-card {
        margin: auto;
        max-width: 320px;
        padding: 20px 18px 16px;
        border-radius: 18px;
        text-align: center;
        border: 2px solid var(--gold-mid);
        background: linear-gradient(180deg, #55206a, #250c38);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
        animation: pop 320ms cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .finish-card h2 {
        margin: 0 0 6px;
        color: var(--gold);
      }
      .finish-card p {
        margin: 0 0 14px;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.5;
      }
      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
      }
      .back {
        font-size: 0.72rem;
        color: var(--muted);
        text-align: center;
      }
      .back a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="app">
      <header>
        <button id="btn-reveal" type="button" class="icon-btn" aria-label="預言：看見所有的星"></button>
        <div class="title">
          <h1>牡羊座星盤 · 第一幕</h1>
          <p id="sub">從帳篷出發，選一條路走到最亮的那顆星</p>
          <div id="progress" class="progress"></div>
        </div>
        <button id="btn-new" type="button" class="icon-btn" aria-label="換一張星盤"></button>
      </header>
      <div id="map-area" class="map-area">
        <div id="map" class="map"></div>
      </div>
      <section id="panel" class="panel" aria-live="polite"></section>
      <div class="back">星盤試作 · 左上「預言」看見所有的星、右上換一張星盤 · <a href="../">回到遊戲</a></div>
    </div>
    <div id="finish" class="finish" hidden>
      <div class="finish-card">
        <h2>牡羊座完成！</h2>
        <p>你點亮了整個星座。正式版會在這裡進入下一幕的星座，或解鎖新的星座貓咪。</p>
        <button id="btn-again" type="button" class="go">再走一次</button>
      </div>
    </div>
    <script type="module" src="map.js"></script>
  </body>
</html>
