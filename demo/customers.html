<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0820" />
    <title>客人試作 · 貓咪占卜師</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" />
    <style>
      :root {
        --gold: #ffd36e;
        --gold-mid: #d9a441;
        --gold-dark: #8a5a12;
        --text: #f4ecff;
        --muted: #b5a6d6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        background:
          radial-gradient(120% 60% at 50% 110%, rgba(255, 170, 80, 0.25), transparent 60%),
          radial-gradient(80% 50% at 20% 10%, rgba(106, 47, 191, 0.35), transparent 70%),
          radial-gradient(70% 50% at 90% 30%, rgba(31, 79, 168, 0.3), transparent 70%),
          linear-gradient(180deg, #0b0820, #1a1035);
        background-attachment: fixed;
        padding: max(16px, env(safe-area-inset-top)) 16px 32px;
      }
      header {
        text-align: center;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: 0.08em;
        background: linear-gradient(180deg, #fff6d8, var(--gold) 55%, #e09a2a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      header p {
        margin: 6px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.5;
      }
      header a {
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .card {
        position: relative;
        padding: 14px 14px 16px;
        border-radius: 20px;
        border: 2px solid var(--gold-mid);
        background: linear-gradient(180deg, rgba(79, 31, 98, 0.92), rgba(42, 15, 60, 0.94));
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.4), inset 0 0 0 3px rgba(255, 211, 110, 0.25), 0 12px 30px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .card.boss {
        border-color: #ff7f98;
        background: linear-gradient(180deg, rgba(90, 20, 60, 0.94), rgba(30, 10, 45, 0.95));
      }
      .tag {
        position: absolute;
        top: -11px;
        left: 50%;
        transform: translateX(-50%);
        padding: 2px 12px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 800;
        white-space: nowrap;
        color: #3a2206;
        background: var(--gold);
      }
      .card.boss .tag {
        color: #fff;
        background: #c43a5e;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 280px;
        aspect-ratio: 1;
      }
      .stage canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .bubble {
        position: relative;
        width: 100%;
        min-height: 3.4em;
        padding: 10px 14px;
        border-radius: 14px;
        background: #fff8ec;
        color: #3a2440;
        font-size: 0.92rem;
        font-weight: 600;
        line-height: 1.5;
        text-align: center;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      }
      .bubble::before {
        content: '';
        position: absolute;
        top: -9px;
        left: 50%;
        transform: translateX(-50%);
        border: 10px solid transparent;
        border-top: 0;
        border-bottom-color: #fff8ec;
      }
      .bubble.pop {
        animation: pop 260ms cubic-bezier(0.2, 1.5, 0.4, 1);
      }
      @keyframes pop {
        from {
          transform: scale(0.85);
        }
      }
      .name {
        font-weight: 900;
        font-size: 1.1rem;
        color: var(--gold);
      }
      .desc {
        margin: 0;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }
      .moods {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      .moods button {
        font: inherit;
        font-size: 0.82rem;
        font-weight: 700;
        padding: 6px 10px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        color: var(--text);
        background: linear-gradient(180deg, #3d2a78, #22164a);
        box-shadow: 0 3px 0 #120a2a, inset 0 0 0 1.5px rgba(255, 211, 110, 0.4);
      }
      .moods button.on {
        color: #3a2206;
        background: linear-gradient(180deg, #fff1bf, var(--gold) 50%, #e8a93a);
        box-shadow: 0 3px 0 var(--gold-dark);
      }
      .mini {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.3);
        font-size: 0.75rem;
        color: var(--muted);
      }
      .mini canvas {
        width: 60px;
        height: 60px;
        flex: none;
        border-radius: 50%;
        border: 2.5px solid var(--gold-mid);
        background: radial-gradient(circle at 50% 40%, #4a2f8c, #1b1040 75%);
      }
      .toolbar {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .toolbar button {
        font: inherit;
        font-weight: 800;
        padding: 9px 16px;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
        color: #3a2206;
        background: linear-gradient(180deg, #fff1bf, var(--gold) 50%, #e8a93a);
        box-shadow: 0 4px 0 var(--gold-dark);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>客人試作</h1>
      <p>三位客人都用程式即時繪製，跟水晶同一種風格。按下面的心情鈕切換表情，或開著「自動輪播」看一輪。<br />每張卡最下面是放進遊戲畫面時的小頭像大小。 · <a href="../">回到遊戲</a></p>
    </header>
    <div class="toolbar"><button id="btn-auto" type="button">自動輪播：開</button></div>
    <main id="grid" class="grid"></main>
    <script type="module" src="customers.js"></script>
  </body>
</html>
